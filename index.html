<!DOCTYPE html>
<html>
  <head>
    <title>Moja Strona AR</title>
    <!-- 1. POPRAWNE podpięcie biblioteki A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <!-- 2. POPRAWNE podpięcie biblioteki AR.js przez githack -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">
    <!-- 3. Stworzenie sceny AR, która uruchomi kamerę -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Sekcja Twojego markera (zmień nazwę pliku .patt na swoją jeśli jest inna!) -->
      <a-marker type="pattern" url="./marker.patt">
        <!-- To się pojawi nad markerem (np. czerwony sześcian) -->
        <a-box position="0 0.5 0" material="color: red; opacity: 0.8;"></a-box>
      </a-marker>
      
      <!-- Kamera potrzebna do wyświetlenia obrazu 3D -->
      
      
    </a-scene>
  </body>
</html>
