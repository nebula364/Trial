<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Mój Stworek 3D w AR</title>
    <!-- Import bibliotek A-Frame oraz AR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
 <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

     <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-assets>
            <!-- Wczytanie pliku 3D stworka -->
            <a-asset-item id="stworekModel" src="stworek.glb"></a-asset-item>
            <a-asset-item id="stworekModel2" src="stworek2.glb"></a-asset-item>
            <a-asset-item id="stworekModel3" src="stworek3.glb"></a-asset-item>
        </a-assets>

    <a-marker type="barcode" value="0">

        <!-- Pozycjonowanie na pierwszym markerze z pliku .mind -->
        
            
            <!-- Twój stworek 3D -->
            <!-- rotation="90 0 0" sprawia, że stworek stoi pionowo na leżącym kodzie QR -->
            <a-gltf-model 
                src="#stworekModel" 
                position="0 -0.5 -1"
                rotation="0 0 0"
                scale="3 3 3">
            </a-gltf-model>
           </a-marker>
        <a-marker type="barcode" value="3">

        <!-- Pozycjonowanie na pierwszym markerze z pliku .mind -->
        
            
            <!-- Twój stworek 3D -->
            <!-- rotation="90 0 0" sprawia, że stworek stoi pionowo na leżącym kodzie QR -->
            <a-gltf-model 
                src="#stworekModel2" 
                position="0 -0.5 -1"
                rotation="0 0 0"
                scale="3 3 3">
            </a-gltf-model>
               </a-marker>
            <a-marker type="barcode" value="5">

        <!-- Pozycjonowanie na pierwszym markerze z pliku .mind -->
        
            
            <!-- Twój stworek 3D -->
            <!-- rotation="90 0 0" sprawia, że stworek stoi pionowo na leżącym kodzie QR -->
            <a-gltf-model 
                src="#stworekModel3" 
                position="0 -0.5 -1"
                rotation="0 0 0"
                scale="3 3 3">
            </a-gltf-model>
                   </a-marker>
                animation="property: rotation; from: 0 0 -15; to: 0 0 15; loop: true; dir: alternate; dur: 1500; easing: easeInOutQuad">

    </a-scene>

</body>
</html>
