<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Mój Stworek 3D w AR</title>
    <!-- Import bibliotek A-Frame oraz AR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

    <!-- Inicjalizacja sceny AR ukrywającej zbędne napisy -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Definicja zasobów (Twojego stworka 3D) -->
        <a-assets>
            <a-asset-item id="stworek" src="stworek.glb"></a-asset-item>
        </a-assets>

        <!-- Definicja Twojego własnego markera z kodem QR -->
        <!-- Podmień 'pattern-qr.patt' na dokładną nazwę swojego pliku markera -->
        <a-marker type="pattern" url="marker.patt">
            
            <!-- Wyświetlenie stworka na markerze -->
            <!-- Skala (scale) i pozycja (position) mogą wymagać dopasowania do Twojego modelu -->
            
            

        </a-marker>

        <!-- Kamera AR, która szuka markera przez obiektyw telefonu -->
        

    </a-scene>

</body>
</html>
