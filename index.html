<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Mój Stworek 3D w AR</title>
    <!-- Import bibliotek A-Frame oraz AR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
 <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

     <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-assets>
            <!-- Wczytanie pliku 3D stworka -->
            <a-asset-item id="stworekModel" src="stworek.glb"></a-asset-item>
        </a-assets>

    <a-marker type="barcode" value="0">

        <!-- Pozycjonowanie na pierwszym markerze z pliku .mind -->
        
            
            <!-- Twój stworek 3D -->
            <!-- rotation="90 0 0" sprawia, że stworek stoi pionowo na leżącym kodzie QR -->
            <a-gltf-model 
                src="#stworekModel" 
                position="0 -0.5 -1"
                rotation="0 0 0"
                scale="3 3 3">
            </a-gltf-model>

         <!-- Stworek z dwiema automatycznymi animacjami -->
            
                animation__rotation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
                
                <!-- ANIMACJA 2: Delikatne unoszenie w górę i w dół (lewitacja) -->
                animation__position="property: position; from: 0 -0.5 -1; to: 0 -0.3 -1; loop: true; dir: alternate; dur: 2000; easing: easeInOutQuad">

    </a-scene>

</body>
</html>
