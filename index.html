<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Mój Stworek 3D w AR</title>
    <!-- Import bibliotek A-Frame oraz AR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
 <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

    <!-- Scena AR łącząca się z Twoim plikiem .mind -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 1" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Wczytanie pliku 3D stworka -->
            <a-asset-item id="stworekModel" src="stworek.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Pozycjonowanie na pierwszym markerze z pliku .mind -->
        
            
            <!-- Twój stworek 3D -->
            <!-- rotation="90 0 0" sprawia, że stworek stoi pionowo na leżącym kodzie QR -->
            <a-gltf-model 
                src="#stworekModel" 
                position="0 0 0" 
                rotation="90 0 0" 
                scale="0.0002 0.0002 0.0002">
            </a-gltf-model>

        

    </a-scene>

</body>
</html>
