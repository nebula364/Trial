<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Moje Sprawne AR z Potworkiem</title>
    <!-- 1. Główny silnik 3D A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- 2. Silnik rzeczywistości rozszerzonej AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- 3. NAPRAWIONY LINK: Pełna i sprawna biblioteka do odtwarzania animacji potworka -->
    <script src="https://jsdelivr.net"></script>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">
    <!-- Inicjalizacja sceny kamery z obsługą kodów kreskowych 3x3 -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      
      <a-assets>
        <!-- Twoje zdjęcie pobierane w świeżej wersji -->
        <img id="moje-zdjecie" src="./foto.png?v=1" crossorigin="anonymous">
        <!-- Model 3D potworka w formacie .glb leżący w tym samym folderze -->
        <a-asset-item id="model-potworka" src="./potworek.glb"></a-asset-item>
      </a-assets>

      <!-- Reagujemy na wydrukowany kod Barcode 0 -->
      <a-marker 
        type="barcode" 
        value="0"
        smooth="true"
        smoothCount="5"
        smoothTolerance="0.01"
        smoothThreshold="2">
        
        <!-- Twoje poziome zdjęcie pochylone lekko w tył -->
        <a-image 
          src="#moje-zdjecie" 
          rotation="-20 0 0" 
          position="0 0.6 -0.6" 
          width="1.2" 
          height="0.7" 
          material="shader: flat; side: double;">
        </a-image>

        <!-- Twoja bezpieczna, niebieska kałuża uniesiona o centymetr, by nie zniknąć -->
        <a-circle 
          rotation="-90 0 0" 
          position="0 0.05 0" 
          radius="0.9" 
          material="color: #3a86ff; opacity: 0.8; shader: flat;">
        </a-circle>

        <!-- Potworek 3D z automatycznym odtwarzaczem ruchu (animation-mixer) -->
        
        
        
      </a-marker>
      
      <!-- Wirtualna kamera nakładająca obiekty 3D na obraz z telefonu -->
      
    </a-scene>
  </body>
</html>
