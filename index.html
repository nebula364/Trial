<!DOCTYPE html>
<html>
  <head>
    <title>Moja Strona AR</title>
    <!-- 1. POPRAWNE podpięcie biblioteki A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <!-- 2. POPRAWNE podpięcie biblioteki AR.js przez githack -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
   <body style="margin: 0px; overflow: hidden;">
    <!-- TUTAJ dodaliśmy obsługę kodów kreskowych (matrix 3x3) -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      <!-- Poprawny system zarządzania zasobami -->
      <a-assets>
        <img id="moje-zdjecie" src="./foto.png" crossorigin="anonymous">
      </a-assets>
          <!-- TUTAJ używamy gotowego szablonu o numerze 0 (nie potrzebujesz pliku .patt!) -->
        <a-marker 
        type="barcode" 
        value="0"
        smooth="true"
        smoothCount="5"
        smoothTolerance="0.01"
        smoothThreshold="2">
        
        <!-- 
          Zmniejszyłem pozycję pionową z 1.0 na 0.4.
          Zdjęcie wciąż unosi się w powietrzu i jest idealnie poziomo, 
          ale nie ucieka już poza krawędź obiektywu telefonu.
        -->
        <a-image 
          src="#moje-zdjecie" 
          rotation="0 0 0" 
          position="0 0.4 0" 
          width="0.8"
          height="0.8"
          material="shader: flat;">
        </a-image>
        
      </a-marker>
      
      
    </a-scene>
  </body>
</html>
