<!DOCTYPE html>
<html>
  <head>
    <title>Moja Strona AR</title>
    <!-- 1. POPRAWNE podpięcie biblioteki A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <!-- 2. POPRAWNE podpięcie biblioteki AR.js przez githack -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<script src="https://jsdelivr.net"></script>
  </head>
   <body style="margin: 0px; overflow: hidden;">
    <!-- TUTAJ dodaliśmy obsługę kodów kreskowych (matrix 3x3) -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      <!-- Poprawny system zarządzania zasobami -->
      <a-assets>
        <img id="moje-zdjecie" src="./foto.png" crossorigin="anonymous">
          TUTAJ: Deklarujemy plik 3D Twojego potworka. 
          Musisz pobrać fioletowego potworka z internetu w formacie .glb lub .gltf, 
          nazwać go 'potworek.glb' i wrzucić do tego samego folderu na GitHubie.
        -->
        <a-asset-item id="model-potworka" src="./potworek.glb"></a-asset-item>
      </a-assets>
          <!-- TUTAJ używamy gotowego szablonu o numerze 0 (nie potrzebujesz pliku .patt!) -->
        <a-marker 
        type="barcode" 
        value="0"
        smooth="true"
        smoothCount="5"
        smoothTolerance="0.01"
        smoothThreshold="2">
        
        <!-- 
          Zmniejszyłem pozycję pionową z 1.0 na 0.4.
          Zdjęcie wciąż unosi się w powietrzu i jest idealnie poziomo, 
          ale nie ucieka już poza krawędź obiektywu telefonu.
        -->
        <a-image 
          src="#moje-zdjecie" 
          rotation="-80 0 0" 
          position="0 0.3 0" 
          width="2.5"
          height="1.5"
          material="shader: flat;">
        </a-image>
        <!-- 1. KAŁUŻA: leży płasko na markerze, ma niebieski kolor i lekki prześwit (opacity) -->
         <a-circle 
          rotation="-90 0 0" 
          position="0 0.01 0" 
          radius="0.5" 
          material="color: #3a86ff; opacity: 0.8; shader: flat;">
        </a-circle>

      </a-marker>
      
      
    </a-scene>
  </body>
</html>
