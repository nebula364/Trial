<!DOCTYPE html>
<html>
  <head>
    <title>Moja Strona AR</title>
    <!-- 1. POPRAWNE podpięcie biblioteki A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <!-- 2. POPRAWNE podpięcie biblioteki AR.js przez githack -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
   <body style="margin: 0px; overflow: hidden;">
    <!-- TUTAJ dodaliśmy obsługę kodów kreskowych (matrix 3x3) -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      
      <!-- TUTAJ używamy gotowego szablonu o numerze 0 (nie potrzebujesz pliku .patt!) -->
      <a-marker type="barcode" value="0">
        <a-box position="0 0.5 0" material="color: red; opacity: 0.8;"></a-box>
      </a-marker>
      
      
    </a-scene>
  </body>
</html>
      
      <!-- Kamera potrzebna do wyświetlenia obrazu 3D -->
      
      
    </a-scene>
  </body>
</html>
